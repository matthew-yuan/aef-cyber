# agent-env config for running locally against an OpenAI-compatible LiteLLM proxy.
# All stores and sandboxes are local (state lives under ~/.local/state/agent-env/).
# Export LITELLM_BASE_URL and LITELLM_API_KEY before running. No credentials are stored here.

[stores]
document = "local"   # SQLite      ~/.local/state/agent-env/document_store/documents.db
object   = "local"   # filesystem  ~/.local/state/agent-env/object_store/
image    = "local"   # local OCI registry (registry:2 at localhost:5000)
secret   = "local"   # process env vars

[sandbox]
default       = "local"   # envs run as containers on the host Docker daemon
agent_default = "local"   # agents too

[agents]
default_a2a_agent_id = "a2a-default"

# Prefix proxy model ids with openai/ for AEF's LiteLLM client. The agent removes
# exactly that routing prefix before sending the original model id to the proxy.
[model]
base_url = "https://litellm-proxy.ml-serving-internal.scale.com/v1"
api_key  = "env:LITELLM_API_KEY"
default  = "openai/openai/gpt-5"

[runner]
impl = "agent_env.runner.local_runner:LocalRunner"

[runner.config]
workers = 2
